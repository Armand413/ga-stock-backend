spring.application.name=gestion-stock

# Connexion PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ga}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jpa.properties.hibernate.format_sql=true

# Port du serveur
server.port=${SERVER_PORT:8080}

# Migrations : ne jamais modifier une migration deja appliquee.
spring.flyway.baseline-on-migrate=${DB_BASELINE:false}
spring.flyway.baseline-version=0
app.bootstrap.identifiant=${ADMIN_USERNAME:}
app.bootstrap.nom=${ADMIN_NAME:Administrateur GA}
app.bootstrap.mot-de-passe=${ADMIN_PASSWORD:}
app.auth.mode=${AUTH_MODE:ad}
app.auth.duree=${AUTH_SESSION_DURATION:PT15M}
app.ad.domaine=${AD_DOMAIN:}
app.ad.url=${AD_URL:}
app.ad.base-dn=${AD_BASE_DN:}
app.ad.groupe-utilisateurs=${AD_USER_GROUP_DN:}
app.ad.groupe-administrateurs=${AD_ADMIN_GROUP_DN:}
app.notifications.administrateurs=${NOTIFICATION_ADMIN_EMAILS:}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.expediteur=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=${MAIL_ENABLED:false}
server.error.include-message=never
server.error.include-stacktrace=never
